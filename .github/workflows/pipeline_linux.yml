name: ML Pipeline (Linux)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      app:
        description: "App to run"
        required: true
        default: "all"
        type: choice
        options: [all, fashion-mnist, cifar-10]

jobs:
  pipeline:
    runs-on: self-hosted
    strategy:
      matrix:
        app: ["fashion-mnist", "cifar-10"]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build \
            -t ${{ matrix.app }}:${{ github.sha }} \
            -t ${{ matrix.app }}:latest \
            -f apps/${{ matrix.app }}/Dockerfile .

      - name: Smoke test
        run: |
          docker run --rm --entrypoint python ${{ matrix.app }}:latest -c "
          import torch
          import torchvision
          from utils import get_model
          model = get_model('SimpleCNN')
          print(f'OK: {type(model).__name__} loaded')
          print(f'OK: torch {torch.__version__}')
          "

      - name: Cleanup old images
        if: always()
        run: docker image prune -f
