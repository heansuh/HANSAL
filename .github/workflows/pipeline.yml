# .github/workflows/pipeline.yml
name: ML Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      app:
        description: "App to run"
        required: true
        default: "all"
        type: choice
        options: [all, fashion-mnist, cifar-10]

jobs:
  pipeline:
    runs-on: self-hosted
    strategy:
      matrix:
        app: ${{ fromJson(
          github.event.inputs.app == null && '["fashion-mnist","cifar-10"]' ||
          github.event.inputs.app == 'all' && '["fashion-mnist","cifar-10"]' ||
          format('["{0}"]', github.event.inputs.app)
        ) }}


    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Build and push image
        run: |
          docker build `
            -t ghcr.io/${{ github.repository }}/${{ matrix.app }}:${{ github.sha }} `
            -t ghcr.io/${{ github.repository }}/${{ matrix.app }}:latest `
            -f apps/${{ matrix.app }}/Dockerfile .
          docker push ghcr.io/${{ github.repository }}/${{ matrix.app }}:latest
        shell: powershell

      - name: Run ETL on K8s
        run: |
          kubectl set image job/- 2>$null; kubectl delete job ${{ matrix.app }}-pipeline --ignore-not-found
          (Get-Content apps/${{ matrix.app }}/k8s/job-pipeline.yaml) -replace 'args: \["etl"\]','args: ["etl"]' | kubectl apply -f -
          kubectl wait --for=condition=complete job/${{ matrix.app }}-pipeline --timeout=300s
        shell: powershell

      - name: Run Training on K8s
        run: |
          kubectl delete job ${{ matrix.app }}-pipeline --ignore-not-found
          (Get-Content apps/${{ matrix.app }}/k8s/job-pipeline.yaml) -replace 'args: \["etl"\]','args: ["train"]' | kubectl apply -f -
          kubectl wait --for=condition=complete job/${{ matrix.app }}-pipeline --timeout=600s
        shell: powershell

      - name: Upload metrics
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.app }}-${{ github.run_id }}
          path: apps/${{ matrix.app }}/metrics/

      - name: Cleanup
        if: always()
        run: kubectl delete job ${{ matrix.app }}-pipeline --ignore-not-found
        shell: powershell
